[project]
name = "gengatewai"
version = "0.1.0"
description = "Deterministic GenGatewAI API exposing the Doubt the Machine framework."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<1",
  "mcp>=2.1,<3",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
