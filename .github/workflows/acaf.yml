name: ACAF contract fuzzing

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acaf-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Check deep ACAF generator integrity
        run: python scripts/check_acaf_generators.py --seeds 25

      - name: Run deep ACAF sweep
        run: python scripts/acaf_ambigator.py --seeds 25 --max-escape-rate 0.0 --max-false-alarm-rate 0.0 --json acaf.json --quiet

      - name: Run operational meaning matrix
        run: python scripts/acaf_meaning_matrix.py --max-inversion-escape-rate 0.0 --max-paraphrase-false-alarm-rate 0.0 --json acaf-meaning.json

      - name: Write ACAF summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## ACAF nightly")
          base = Path("acaf.json")
          if not base.exists():
              print("\nNo base ACAF result file was produced; inspect generator-integrity and sweep steps.")
          else:
              summary = json.loads(base.read_text(encoding="utf-8"))["summary"]
              print()
              print(f"- Base mutations: **{summary['total_mutations']}**")
              print(f"- Escape rate: **{summary['escape_rate']:.3f}** ({summary['escaped']}/{summary['must_catch']})")
              print(f"- False-alarm rate: **{summary['false_alarm_rate']:.3f}** ({summary['false_alarms']}/{summary['must_pass']})")

          meaning = Path("acaf-meaning.json")
          if not meaning.exists():
              print("\nNo operational-meaning matrix result was produced; inspect that step.")
          else:
              m = json.loads(meaning.read_text(encoding="utf-8"))["summary"]
              print()
              print(f"- Meaning cases: **{m['total_cases']}** (27 inversions + 27 paraphrases)")
              print(f"- Inversion escape rate: **{m['inversion_escape_rate']:.3f}** ({m['escaped_inversions']}/{m['inversions']})")
              print(f"- Paraphrase false-alarm rate: **{m['paraphrase_false_alarm_rate']:.3f}** ({m['paraphrase_false_alarms']}/{m['paraphrases']})")

          print()
          print("These rates describe only the declared ACAF mutation and operational-meaning spans; they are not evidence that the framework is effective or that CI performs general semantic entailment.")
          PY
