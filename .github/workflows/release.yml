name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-tagged-tree:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Check Rule 0 contract
        run: python scripts/check_rule0.py

      - name: Deep ACAF sweep
        run: python scripts/acaf_ambigator.py --seeds 25 --max-escape-rate 0.0 --max-false-alarm-rate 0.0 --quiet

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python/API/MCP tests
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run vGPU visualization contract
        run: |
          cd web
          npm ci
          npm test
          npm run typecheck

      - name: Build production image
        run: docker build --pull=false -t gengatewai:release .

      - name: Verify production image boundary
        run: |
          test "$(docker run --rm gengatewai:release id -u)" != "0"
          docker run --rm gengatewai:release sh -eu -c '
            test ! -e /app/.git
            test ! -e /app/.github
            test ! -e /app/.codex
            test ! -e /app/tests
            test ! -e /app/web
            test ! -e /app/.env
            test -d /app/api
            test -d /app/experiments
          '
          user="$(docker image inspect gengatewai:release --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"

      - name: Smoke test release image
        run: |
          cid="$(docker run -d -p 127.0.0.1:18000:8000 gengatewai:release)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/healthz.json').read_text())
          assert payload['service'] == 'GenGatewAI'
          assert payload['status'] == 'ok'
          PY

  publish-release:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    needs: verify-tagged-tree
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
