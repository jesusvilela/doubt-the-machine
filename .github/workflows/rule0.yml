name: Rule 0 contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-audit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Rule 0 contract
        run: python scripts/check_rule0.py
