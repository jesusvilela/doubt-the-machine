name: Rule 0 contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-audit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Rule 0 contract
        run: python scripts/check_rule0.py

      - name: Install API test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test GenGatewAI API
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test vGPU visualization contract
        run: |
          cd web
          npm ci
          npm test
          npm run typecheck
