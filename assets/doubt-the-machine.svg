<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Doubt the Machine</title>
  <desc id="desc">Twenty-seven practical rules plus one governing Rule 0 for using AI with verification and reversibility: doubt the machine, doubt the bits, doubt the build.</desc>
  <rect width="1600" height="1100" fill="#111214"/>
  <rect x="0" y="0" width="1600" height="46" fill="#f3cf3b"/>
  <text x="36" y="31" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151515" letter-spacing="2">DOUBT · MEASURE · TEST · REVERT · DOUBT · MEASURE · TEST · REVERT</text>
  <text x="1565" y="31" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#151515">Rule 0 applies to everything</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="42" y="78" width="486" height="952" rx="22" fill="#17191d" stroke="#282b31"/>
    <rect x="557" y="78" width="486" height="952" rx="22" fill="#17191d" stroke="#282b31"/>
    <rect x="1072" y="78" width="486" height="952" rx="22" fill="#17191d" stroke="#282b31"/>

    <rect x="64" y="112" width="350" height="58" rx="10" fill="#f3cf3b"/>
    <text x="82" y="151" font-size="34" font-weight="800" fill="#111">Doubt the machine</text>
    <text x="66" y="198" font-size="18" fill="#f0f0f0">The AI is a tool, not a judge.</text>

    <rect x="579" y="112" width="290" height="58" rx="10" fill="#b9dc59"/>
    <text x="597" y="151" font-size="34" font-weight="800" fill="#111">Doubt the bits</text>
    <text x="581" y="198" font-size="18" fill="#f0f0f0">Generated information needs evidence.</text>

    <rect x="1094" y="112" width="302" height="58" rx="10" fill="#e65f8f"/>
    <text x="1112" y="151" font-size="34" font-weight="800" fill="#111">Doubt the build</text>
    <text x="1096" y="198" font-size="18" fill="#f0f0f0">Generated code still fails.</text>

    <g font-size="18" font-weight="700">
      <g transform="translate(66 230)">
        <rect width="438" height="58" rx="8" fill="#b9dc59"/><text x="18" y="36" fill="#111">1  Don’t trust the praise</text>
        <rect y="70" width="438" height="58" rx="8" fill="#e65f8f"/><text x="18" y="106" fill="#111">2  Don’t trust criticism either</text>
        <rect y="140" width="438" height="58" rx="8" fill="#4c94d8"/><text x="18" y="176" fill="#fff">3  Sounding right ≠ being right</text>
        <rect y="210" width="438" height="58" rx="8" fill="#ef7f32"/><text x="18" y="246" fill="#111">4  Ask how it could be wrong</text>
        <rect y="280" width="438" height="58" rx="8" fill="#8062c9"/><text x="18" y="316" fill="#fff">5  Make it prove it</text>
        <rect y="350" width="438" height="58" rx="8" fill="#f3cf3b"/><text x="18" y="386" fill="#111">6  Re-sample; don’t call it independent</text>
        <rect y="420" width="438" height="58" rx="8" fill="#4fc5ae"/><text x="18" y="456" fill="#111">7  Check outside the AI</text>
        <rect y="490" width="438" height="58" rx="8" fill="#ef4b4b"/><text x="18" y="526" fill="#fff">8  Notice what it leaves out</text>
        <rect y="560" width="438" height="58" rx="8" fill="#e9e9e9"/><text x="18" y="596" fill="#111">9  Test framing invariance</text>
        <rect y="642" width="438" height="74" rx="8" fill="none" stroke="#b9dc59" stroke-width="4" stroke-dasharray="10 8"/><text x="18" y="672" fill="#b9dc59">Reflexive</text><text x="18" y="700" fill="#b9dc59">Apply Rule 0 to this panel</text>
      </g>

      <g transform="translate(581 230)">
        <rect width="438" height="58" rx="8" fill="#4c94d8"/><text x="18" y="36" fill="#fff">1  Treat output as proposal, not proof</text>
        <rect y="70" width="438" height="58" rx="8" fill="#b9dc59"/><text x="18" y="106" fill="#111">2  Fluent ≠ true</text>
        <rect y="140" width="438" height="58" rx="8" fill="#e65f8f"/><text x="18" y="176" fill="#111">3  Generated detail needs provenance</text>
        <rect y="210" width="438" height="58" rx="8" fill="#f3cf3b"/><text x="18" y="246" fill="#111">4  Every rewrite can lose something</text>
        <rect y="280" width="438" height="58" rx="8" fill="#8062c9"/><text x="18" y="316" fill="#fff">5  Long chats get noisy</text>
        <rect y="350" width="438" height="58" rx="8" fill="#ef7f32"/><text x="18" y="386" fill="#111">6  Repeat what matters</text>
        <rect y="420" width="438" height="58" rx="8" fill="#4fc5ae"/><text x="18" y="456" fill="#111">7  One answer is one sample</text>
        <rect y="490" width="438" height="58" rx="8" fill="#ef4b4b"/><text x="18" y="526" fill="#fff">8  Confidence ≠ accuracy</text>
        <rect y="560" width="438" height="58" rx="8" fill="#e9e9e9"/><text x="18" y="596" fill="#111">9  “Best” needs a baseline</text>
        <rect y="642" width="438" height="74" rx="8" fill="none" stroke="#4c94d8" stroke-width="4" stroke-dasharray="10 8"/><text x="18" y="672" fill="#4c94d8">Reflexive</text><text x="18" y="700" fill="#4c94d8">Doubt the compression</text>
      </g>

      <g transform="translate(1096 230)">
        <rect width="438" height="58" rx="8" fill="#ef7f32"/><text x="18" y="36" fill="#111">1  “AI says it works” means nothing</text>
        <rect y="70" width="438" height="58" rx="8" fill="#4fc5ae"/><text x="18" y="106" fill="#111">2  No unverified behavior, no merge</text>
        <rect y="140" width="438" height="58" rx="8" fill="#4c94d8"/><text x="18" y="176" fill="#fff">3  Own every changed behavior</text>
        <rect y="210" width="438" height="58" rx="8" fill="#b9dc59"/><text x="18" y="246" fill="#111">4  Make retries safe</text>
        <rect y="280" width="438" height="58" rx="8" fill="#f3cf3b"/><text x="18" y="316" fill="#111">5  Add logs, not only features</text>
        <rect y="350" width="438" height="58" rx="8" fill="#e65f8f"/><text x="18" y="386" fill="#111">6  Ask it to delete, not just add</text>
        <rect y="420" width="438" height="58" rx="8" fill="#8062c9"/><text x="18" y="456" fill="#fff">7  Prefer inspectable dependencies</text>
        <rect y="490" width="438" height="58" rx="8" fill="#ef4b4b"/><text x="18" y="526" fill="#fff">8  Assume partial failure</text>
        <rect y="560" width="438" height="58" rx="8" fill="#e9e9e9"/><text x="18" y="596" fill="#111">9  Small changes, easy rollback</text>
        <rect y="642" width="438" height="74" rx="8" fill="none" stroke="#ef7f32" stroke-width="4" stroke-dasharray="10 8"/><text x="18" y="672" fill="#ef7f32">Reflexive</text><text x="18" y="700" fill="#ef7f32">Test this list too</text>
      </g>
    </g>

    <text x="800" y="1048" text-anchor="middle" font-size="20" fill="#c8c8c8">Proposal ≠ proof · Evidence moves confidence · The reviewer is still you · v1.2 · 2026</text>
  </g>
</svg>
